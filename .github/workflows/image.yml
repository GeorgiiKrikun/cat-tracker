# Builds the production image with Nix (`nix build .#docker`, same as
# `just docker`) and pushes it to GHCR:
#   ghcr.io/georgiikrikun/cattracker:sha-<7 chars>  and  :main
# The infra repo (cattracker/compose.yml) pins the tag that runs on the server.
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix build .#docker -o result-docker
      - name: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | skopeo login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "sha-${GITHUB_SHA::7}" main; do
            skopeo copy docker-archive:result-docker "docker://ghcr.io/georgiikrikun/cattracker:$tag"
          done
